name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 4 * * 1"

# Cancel in-progress runs for the same ref on PRs to avoid wasting runner minutes.
# Push to main and scheduled runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  analyze-swift:
    name: Analyze (swift)
    # macOS runner is slow — run only on main branch pushes and weekly schedule.
    # build-mode: none skips compilation (autobuild took ~21 min due to Xcode toolchain
    # init + Gatekeeper checks on CodeQL binaries). Buildless extraction is accurate
    # enough for a single-file utility like macos_path_picker.swift.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
